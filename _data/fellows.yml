- name: Max McCandless, Ph.D.
  photo: Max2.png
  interests: Medical Robotics, Surgical Robotics, Soft Robotic Sensing and Actuation
  email: Max.McCandless@childrens.harvard.edu
  bio: Max received his Ph.D. in 2023 from Boston University. His research involves the design, modeling, and control of soft robots for minimally invasive surgery.​ He is working toward developing new robots for cardiac interventions.

- name: Abhijit Mondal, Ph.D.
  photo: Abhijit.jpg
  interests: Biomedical engineering, medical devices, intraoperative imaging, endoscopy
  email: Abhijit.Mondal@childrens.harvard.edu
  bio: Abhijit received his PhD in Bioengineering in 2017 from University of Utah (Salt Lake City, UT, USA). His research involves the development of airway stent systems for treating tracheobronchomalacia.

- name: Yuan Wang, M.S.
  photo: Yuan.png
  interests: Artificial Intelligence, Machine Learning, Robot Modeling, Medical Device Algorithms
  email: Yuan.Wang3@childrens.harvard.edu
  bio: Yuan earned her M.S. degree from Shanghai Jiao Tong University. Her current research focuses on the development of learning-based methods for kinematic modeling of medical robots.
  
- name: Neel Shihora, Ph.D.
  photo: Neel.jpg
  interests: Surgical Robotics, Haptics, Modeling and Simulation, Continuum Robots, Controls
  email: Neel.Shihora@childrens.harvard.edu
  bio: Neel received his Ph.D. in 2024 from Vanderbilt University, where his research focused on task-based design, modeling, and telemanipulation assistance of dexterous robotics for surgical confined spaces and remote intervention. His current research involves investigating modeling and control techniques for tendon-driven telescoping catheters used in cardiac interventions.

- name: Hun Chan (Bryan) Lee, Ph.D.
  photo: Bryan.jpg
  interests: Surgical robotics, Soft robotics
  email: Bryan.Lee@childrens.harvard.edu
  bio: Bryan received his Ph.D. in 2025 from Boston University, where his research focused on design, manufacturing and control of soft-rigid hybrid robots. His current research involves developing transcatheter robotic devices for minimally invasive cardiac procedures.

- name: Maria Doikova, B.S. 
  photo: Maria.PNG
  interests: Medical and Surgical Devices, Design, Biomedical Engineering
  email: Maria.Doikova@childrens.harvard.edu
  bio: Maria completed her BSc in Health Sciences and Technology (HST) at the Swiss Federal Institute of Technology, ETH Zürich. She is now pursuing her Master’s degree in HST at the same institution, with a specialisation in Medical Technology. Maria is currently working on her Master's thesis at the Dupont Laboratory. Her research focuses on the development and evaluation of a robotic catheter for minimally invasive cardiac procedures.
  
- name: Stefania Bottoni, B.S.
  photo: Stef.jpg
  interests: Medical & Surgery Robotics, Soft Robotics, Design & Development
  email: Stefania.Bottoni@childrens.harvard.edu
  bio: Stefania completed her BSc in Mechanical Engineering at the Swiss Federal Institute of Technology, ETH Zürich. She is currently pursuing a Master's degree in Mechanical Engineering at ETH, specialising in Medical Robotics and Rehabilitation. Her work spans soft robotics, teleoperated surgical systems, and human–machine interaction. At the Dupont Laboratory, she is conducting her Master’s thesis on a transcatheter system for minimally invasive intracardiac procedures, with an emphasis on design, fabrication, and system integration.

